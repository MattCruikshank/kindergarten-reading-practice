<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>High Frequency Words</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: 'Lexend', sans-serif;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    background: #fdf6e3;
  }
  #container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 1fr);
    height: 100%;
    width: 100%;
  }
  .word {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.5rem, 5vw, 3.5rem);
    font-weight: 400;
    color: #222;
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400&display=swap" rel="stylesheet">
</head>
<body>
<div id="container"></div>
<script>
const words = [
  "a","find","like","so","with",
  "all","food","little","some","yellow",
  "am","for","look","that","you",
  "and","four","make","the","your",
  "are","from","me","there",
  "at","go","must","they",
  "be","had","my","this",
  "big","has","no","three",
  "black","have","not","to",
  "blue","he","of","too",
  "book","help","on","two",
  "brown","here","one","up",
  "but","him","or","want",
  "by","I","out","was",
  "can","if","play","we",
  "come","in","said","went",
  "day","is","saw","what",
  "did","it","school","where",
  "do","jump","see","who",
  "down","just","she","will"
];

function pickRandom(arr, n) {
  const shuffled = [...arr].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, n);
}

const PER_PAGE = 20;
const GOAL = 13;
let lastTime = null;

function showWords() {
  const now = Date.now();
  if (lastTime) {
    const elapsed = (now - lastTime) / 60000;
    const rate = Math.round(PER_PAGE / elapsed);
    document.title = `${rate}/min (goal: ${GOAL}/min) — High Frequency Words`;
    console.log(`${PER_PAGE} words in ${elapsed.toFixed(1)}min → ${rate}/min (goal: ${GOAL}/min)`);
  } else {
    document.title = `High Frequency Words (goal: ${GOAL}/min)`;
  }
  lastTime = now;
  const container = document.getElementById('container');
  container.innerHTML = '';
  const chosen = pickRandom(words, 20);
  for (const w of chosen) {
    const div = document.createElement('div');
    div.className = 'word';
    div.textContent = w;
    container.appendChild(div);
  }
}

document.body.addEventListener('click', showWords);
showWords();
</script>
</body>
</html>
